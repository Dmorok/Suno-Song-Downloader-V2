<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
        --accent: #6d5bf0;
        --accent-dark: #5a49d6;
        --mp3: #22a35e;
        --mp3-dark: #1c8a4e;
        --danger: #e5484d;
        --danger-dark: #c53d41;
        --text: #23213a;
        --muted: #75708f;
        --border: #e4e1f5;
        --bg: #faf9ff;
      }

      * { box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 250px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .header img { width: 22px; height: 22px; }

      h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-bottom: 8px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.05s ease;
      }

      button:hover { opacity: 0.92; }
      button:active { transform: scale(0.98); }
      button:disabled { cursor: not-allowed; opacity: 0.5; }

      #downloadWav { background: var(--accent); }
      #downloadWav:hover { background: var(--accent-dark); }
      #downloadMp3 { background: var(--mp3); }
      #downloadMp3:hover { background: var(--mp3-dark); }
      #stopBtn { background: var(--danger); }
      #stopBtn:hover { background: var(--danger-dark); }
      #copyScriptBtn {
        background: transparent;
        color: var(--muted);
        border: 1px dashed var(--border);
        font-weight: 500;
        margin-top: 4px;
      }
      #copyScriptBtn:hover { background: #f1effc; opacity: 1; }

      .settings {
        border-top: 1px solid var(--border);
        padding-top: 10px;
        margin-top: 6px;
        margin-bottom: 10px;
        font-size: 12.5px;
      }

      .settings div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--text);
      }

      .settings div:last-child { margin-bottom: 0; }

      .settings input[type="number"] {
        width: 44px;
        padding: 3px 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
        text-align: center;
      }

      .settings input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
      }

      #status {
        margin-top: 10px;
        min-height: 14px;
        font-size: 11.5px;
        color: var(--muted);
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icon48.png" alt="">
      <h3>Suno Downloader</h3>
    </div>

    <button id="downloadWav">⬇ Download All WAVs</button>
    <button id="downloadMp3">⬇ Download All MP3s</button>
    <button id="stopBtn" style="display: none;">■ Stop Downloads</button>

    <div class="settings">
      <div>
        <label for="delaySeconds">Delay between songs (sec)</label>
        <input type="number" id="delaySeconds" min="0" value="3" step="1">
      </div>
      <div>
        <label for="createSubfolder">Create subfolder</label>
        <input type="checkbox" id="createSubfolder" checked>
      </div>
      <div>
        <label for="includeJpeg">Include cover art</label>
        <input type="checkbox" id="includeJpeg" checked>
      </div>
      <div>
        <label for="includeUuid">Include UUID in name</label>
        <input type="checkbox" id="includeUuid" checked>
      </div>
    </div>

    <button id="copyScriptBtn">📋 Copy manual WAV script</button>

    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
